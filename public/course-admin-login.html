<!-- public/course-admin-login.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TeeRadar — Course Admin Login</title>
  <link rel="icon" type="image/png" href="/assets/icon-192.png" />
  <style>
    :root{
      --teal:#00796b;
      --teal-dark:#005e55;
      --bg:#f4f7fb;
      --card:#ffffff;
      --text:#0f172a;
      --muted:#64748b;
      --border:#e2e8f0;
      --danger:#b91c1c;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}
    .wrap{max-width:560px;margin:26px auto;padding:0 16px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px}
    h2{margin:0 0 6px}
    .muted{color:var(--muted);font-size:13px}
    label{display:block;margin-top:12px;font-size:13px;color:var(--muted)}
    input{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:12px;font:inherit}
    button{margin-top:14px;width:100%;padding:12px;border:0;border-radius:12px;background:var(--teal);color:#fff;font-weight:800;cursor:pointer}
    button.secondary{background:#475569}
    .row{display:flex;gap:10px;margin-top:10px}
    .row button{width:50%}
    .msg{margin-top:10px;font-size:13px;color:var(--muted)}
    a{color:var(--teal);text-decoration:none}
    pre{
      display:none;
      white-space:pre-wrap;
      margin-top:10px;
      font-size:12px;
      background:#f8fafc;
      border:1px solid #e2e8f0;
      border-radius:12px;
      padding:10px;
      color:#0f172a;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h2>Course Admin Login</h2>
      <div class="muted">For golf courses only. Log in to manage tee times, pricing, bookings + analytics.</div>

      <label>Email</label>
      <input id="email" placeholder="admin@yourcourse.com.au" autocomplete="email" />

      <label>Password</label>
      <input id="pass" type="password" placeholder="Your password" autocomplete="current-password" />

      <!-- ✅ type="button" prevents any accidental form-submit reloads -->
      <button id="loginBtn" type="button">Log in</button>

      <div class="row">
        <button id="goHomeBtn" class="secondary" type="button">Back to site</button>
        <button id="logoutBtn" class="secondary" type="button">Log out</button>
      </div>

      <div id="msg" class="msg"></div>
      <pre id="debug"></pre>
    </div>
  </div>

<script>
  // ✅ Single source of truth token key (must match course-admin.html)
  const ADMIN_TOKEN_KEY = "tr_course_admin_token";

  // ✅ Single source of truth API base (bookingRoutes are mounted at /api/book)
  const API_BASE = "/api/book";

  function getAdminToken(){
    try { return localStorage.getItem(ADMIN_TOKEN_KEY) || ""; } catch { return ""; }
  }
  function setAdminToken(t){
    try { localStorage.setItem(ADMIN_TOKEN_KEY, String(t || "")); } catch {}
  }
  function clearAdminToken(){
    try { localStorage.removeItem(ADMIN_TOKEN_KEY); } catch {}
  }

  function debug(o){
    const el = document.getElementById("debug");
    if(!el) return;
    el.style.display = "block";
    el.textContent = (typeof o === "string") ? o : JSON.stringify(o, null, 2);
  }

  // ✅ more robust JSON fetch: detects HTML / non-JSON and shows it
  async function j(url, opts){
    const res = await fetch(url, {
      // ✅ token-only auth: do NOT rely on cookies (Safari can be flaky)
      credentials: "omit",
      ...opts,
      headers: {
        "Content-Type": "application/json",
        ...(opts && opts.headers ? opts.headers : {})
      }
    });

    const raw = await res.text();
    const ct = String(res.headers.get("content-type") || "");

    let data = null;
    const looksLikeHtml = raw && raw.trim().startsWith("<!doctype html") || raw.trim().startsWith("<html");
    const looksJson = ct.includes("application/json");

    if (looksJson) {
      try { data = JSON.parse(raw); } catch { data = { _parseError: true, _raw: raw.slice(0, 400) }; }
    } else {
      // try json anyway (some servers forget headers)
      try { data = JSON.parse(raw); } catch {
        data = {
          _nonJson: true,
          _contentType: ct || null,
          _looksLikeHtml: !!looksLikeHtml,
          _rawPreview: (raw || "").slice(0, 400)
        };
      }
    }

    if(!res.ok) {
      const err = (data && data.error) ? data.error : ("HTTP " + res.status);
      const e = new Error(err);
      e._debug = { status: res.status, url, data };
      throw e;
    }

    return data || {};
  }

  const $ = (id)=>document.getElementById(id);

  window.addEventListener("error", (ev)=>{
    try{
      const msg = ev?.message || "script_error";
      $("msg").textContent = "❌ " + msg;
      debug({ step:"window_error", msg, filename: ev?.filename, lineno: ev?.lineno, colno: ev?.colno });
    }catch{}
  });

  window.addEventListener("unhandledrejection", (ev)=>{
    try{
      const msg = (ev && ev.reason && (ev.reason.message || String(ev.reason))) || "promise_rejection";
      $("msg").textContent = "❌ " + msg;
      debug({ step:"unhandledrejection", msg, reason: ev && ev.reason ? String(ev.reason) : null });
    }catch{}
  });

  window.addEventListener("DOMContentLoaded", ()=>{
    debug({
      step:"dom_ready",
      origin: location.origin,
      apiBase: API_BASE,
      tokenPresent: !!getAdminToken()
    });

    $("goHomeBtn").addEventListener("click", ()=> location.href = "/");

    $("logoutBtn").addEventListener("click", async ()=>{
      $("msg").textContent = "Logging out...";
      try{ await j(`${API_BASE}/course-admin/logout`, { method:"POST", body:"{}" }); }catch{}
      clearAdminToken();
      $("msg").textContent = "✅ Logged out";
      debug({ step:"logged_out", tokenNow: getAdminToken() ? "present" : "missing" });
    });

    $("loginBtn").addEventListener("click", async ()=>{
      $("msg").textContent = "Logging in...";
      debug(""); // clear visible output

      try{
        const email = ($("email").value || "").trim();
        const password = $("pass").value || "";
        if(!email || !password) throw new Error("missing_email_password");

        clearAdminToken();

        // ✅ LOGIN (correct mounted path)
        const out = await j(`${API_BASE}/course-admin/login`, {
          method:"POST",
          body: JSON.stringify({ email, password })
        });

        const token =
          (out && (out.token || out.courseAdminToken || out.accessToken)) ? (out.token || out.courseAdminToken || out.accessToken) : "";

        if(!token){
          debug({ step:"login_ok_but_no_token", out });
          throw new Error("login_no_token_returned");
        }

        setAdminToken(token);

        // ✅ PROVE TOKEN WORKS: call /me with Bearer token
        const me = await j(`${API_BASE}/course-admin/me`, {
          method:"GET",
          headers: { Authorization: `Bearer ${token}` }
        });

        debug({
          step: "login_saved_token_and_verified",
          tokenPreview: String(token).slice(0, 20) + "…",
          slug: me && me.slug ? me.slug : (out.slug || null),
          email: me && me.email ? me.email : (out.email || null)
        });

        $("msg").textContent = "✅ Logged in";
        setTimeout(()=> location.href = "/course-admin.html", 250);

      }catch(e){
        $("msg").textContent = "❌ " + (e && e.message ? e.message : "login_failed");

        // show extra debug if available
        const extra = e && e._debug ? e._debug : null;
        debug({
          step:"login_error",
          msg: String(e && e.message ? e.message : e),
          tokenNow: getAdminToken() ? "present" : "missing",
          extra
        });
      }
    });
  });
</script>
</body>
</html>
