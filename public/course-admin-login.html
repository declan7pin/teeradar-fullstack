<!-- public/course-admin-login.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TeeRadar — Course Admin Login</title>
  <link rel="icon" type="image/png" href="/assets/icon-192.png" />
  <style>
    :root{
      --teal:#00796b;
      --teal-dark:#005e55;
      --bg:#f4f7fb;
      --card:#ffffff;
      --text:#0f172a;
      --muted:#64748b;
      --border:#e2e8f0;
      --danger:#b91c1c;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}
    .wrap{max-width:560px;margin:26px auto;padding:0 16px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px}
    h2{margin:0 0 6px}
    .muted{color:var(--muted);font-size:13px}
    label{display:block;margin-top:12px;font-size:13px;color:var(--muted)}
    input{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:12px;font:inherit}
    button{margin-top:14px;width:100%;padding:12px;border:0;border-radius:12px;background:var(--teal);color:#fff;font-weight:800;cursor:pointer}
    button.secondary{background:#475569}
    .row{display:flex;gap:10px;margin-top:10px}
    .row button{width:50%}
    .msg{margin-top:10px;font-size:13px;color:var(--muted)}
    a{color:var(--teal);text-decoration:none}
    pre{
      display:none;
      white-space:pre-wrap;
      margin-top:10px;
      font-size:12px;
      background:#f8fafc;
      border:1px solid #e2e8f0;
      border-radius:12px;
      padding:10px;
      color:#0f172a;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h2>Course Admin Login</h2>
      <div class="muted">For golf courses only. Log in to manage tee times, pricing, bookings + analytics.</div>

      <label>Email</label>
      <input id="email" placeholder="admin@yourcourse.com.au" autocomplete="email" />

      <label>Password</label>
      <input id="pass" type="password" placeholder="Your password" autocomplete="current-password" />

      <button id="loginBtn">Log in</button>

      <div class="row">
        <button id="goHomeBtn" class="secondary" type="button">Back to site</button>
        <button id="logoutBtn" class="secondary" type="button">Log out</button>
      </div>

      <div id="msg" class="msg"></div>
      <pre id="debug"></pre>
    </div>
  </div>

<script>
  // ✅ Single source of truth token key (must match course-admin.html)
  const ADMIN_TOKEN_KEY = "tr_course_admin_token";

  function getAdminToken(){
    try { return localStorage.getItem(ADMIN_TOKEN_KEY) || ""; } catch { return ""; }
  }
  function setAdminToken(t){
    try { localStorage.setItem(ADMIN_TOKEN_KEY, String(t || "")); } catch {}
  }
  function clearAdminToken(){
    try { localStorage.removeItem(ADMIN_TOKEN_KEY); } catch {}
  }

  function debug(o){
    const el = document.getElementById("debug");
    if(!el) return;
    el.style.display = "block";
    el.textContent = (typeof o === "string") ? o : JSON.stringify(o, null, 2);
  }

  async function j(url, opts){
    const res = await fetch(url, {
      credentials: "include",
      ...opts,
      headers: {
        "Content-Type": "application/json",
        ...(opts && opts.headers ? opts.headers : {})
      }
    });

    const raw = await res.text();
    let data = {};
    try { data = JSON.parse(raw); } catch { data = { _nonJson: raw.slice(0,300) }; }

    if(!res.ok) {
      const err = data && data.error ? data.error : ("HTTP "+res.status);
      throw new Error(err);
    }
    return data;
  }

  const $ = (id)=>document.getElementById(id);

  $("goHomeBtn").onclick = ()=> location.href = "/";

  $("logoutBtn").onclick = async ()=>{
    $("msg").textContent = "Logging out...";
    try{ await j("/api/book/course-admin/logout", { method:"POST", body:"{}" }); }catch{}
    clearAdminToken();
    $("msg").textContent = "✅ Logged out";
    debug({ tokenNow: getAdminToken() ? "present" : "missing" });
  };

  $("loginBtn").onclick = async ()=>{
    $("msg").textContent = "Logging in...";
    debug(""); // clear visible output
    try{
      const email = ($("email").value || "").trim();
      const password = $("pass").value || "";
      if(!email || !password) throw new Error("missing_email_password");

      // ✅ Hard clear before login (avoid stale token)
      clearAdminToken();

      const out = await j("/api/book/course-admin/login", {
        method:"POST",
        body: JSON.stringify({ email, password })
      });

      // ✅ REQUIRE token for admin pages (don’t rely on cookies)
      if(!out || !out.token){
        debug({ step:"login_ok_but_no_token", out });
        throw new Error("login_no_token_returned");
      }

      setAdminToken(out.token);

      debug({
        step: "login_saved_token",
        tokenPreview: String(out.token).slice(0, 20) + "…",
        slug: out.slug || null
      });

      $("msg").textContent = "✅ Logged in";
      setTimeout(()=> location.href = "/course-admin.html", 250);
    }catch(e){
      $("msg").textContent = "❌ " + e.message;
      debug({ step:"login_error", msg: String(e.message || e), tokenNow: getAdminToken() ? "present" : "missing" });
    }
  };
</script>
</body>
</html>
