<!-- public/course-admin-login.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TeeRadar — Course Admin Login</title>
  <link rel="icon" type="image/png" href="/assets/icon-192.png" />
  <style>
    :root{
      --teal:#00796b;
      --teal-dark:#005e55;
      --bg:#f4f7fb;
      --card:#ffffff;
      --text:#0f172a;
      --muted:#64748b;
      --border:#e2e8f0;
      --danger:#b91c1c;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}
    .wrap{max-width:560px;margin:26px auto;padding:0 16px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px}
    h2{margin:0 0 6px}
    .muted{color:var(--muted);font-size:13px}
    label{display:block;margin-top:12px;font-size:13px;color:var(--muted)}
    input{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:12px;font:inherit}
    button{margin-top:14px;width:100%;padding:12px;border:0;border-radius:12px;background:var(--teal);color:#fff;font-weight:800;cursor:pointer}
    button.secondary{background:#475569}
    .row{display:flex;gap:10px;margin-top:10px}
    .row button{width:50%}
    .msg{margin-top:10px;font-size:13px;color:var(--muted)}
    a{color:var(--teal);text-decoration:none}
    pre{white-space:pre-wrap;margin-top:10px;font-size:12px;color:#0f172a;background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:10px;display:none}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h2>Course Admin Login</h2>
      <div class="muted">For golf courses only. Log in to manage tee times, pricing, bookings + analytics.</div>

      <label>Email</label>
      <input id="email" placeholder="admin@yourcourse.com.au" autocomplete="email" />

      <label>Password</label>
      <input id="pass" type="password" placeholder="Your password" autocomplete="current-password" />

      <button id="loginBtn">Log in</button>

      <div class="row">
        <button id="goHomeBtn" class="secondary" type="button">Back to site</button>
        <button id="logoutBtn" class="secondary" type="button">Log out</button>
      </div>

      <div id="msg" class="msg"></div>
      <pre id="debug"></pre>
    </div>
  </div>

<script>
  // ✅ Keep token support as optional fallback, but DO NOT require it.
  // IMPORTANT: This key must match course-admin.html (you currently use tr_course_admin_token there)
  const ADMIN_TOKEN_KEY = "tr_course_admin_token";

  function getAdminToken(){
    try { return localStorage.getItem(ADMIN_TOKEN_KEY) || ""; } catch { return ""; }
  }
  function setAdminToken(t){
    try { if(t) localStorage.setItem(ADMIN_TOKEN_KEY, String(t)); } catch {}
  }
  function clearAdminToken(){
    try { localStorage.removeItem(ADMIN_TOKEN_KEY); } catch {}
  }

  const $ = (id)=>document.getElementById(id);

  function dbg(o){
    const el = $("debug");
    if(!el) return;
    el.style.display = "block";
    el.textContent = (typeof o === "string") ? o : JSON.stringify(o, null, 2);
  }

  async function j(url, opts){
    const token = getAdminToken();
    const headers = {
      "Content-Type": "application/json",
      ...(opts && opts.headers ? opts.headers : {}),
      ...(token ? { "Authorization": "Bearer " + token } : {}),
    };

    const res = await fetch(url, {
      credentials: "include",
      ...opts,
      headers,
    });

    const text = await res.text();
    let data = {};
    try { data = JSON.parse(text); }
    catch { data = { _nonJson: String(text || "").slice(0, 300) }; }

    // ✅ capture token if backend returns it (optional)
    if (data && (data.token || data.accessToken)) {
      setAdminToken(String(data.token || data.accessToken));
    }

    if(!res.ok) throw new Error(data.error || ("HTTP "+res.status));
    return data;
  }

  $("goHomeBtn").onclick = ()=> location.href = "/";

  $("logoutBtn").onclick = async ()=>{
    $("msg").textContent = "Logging out...";
    try{
      await j("/api/book/course-admin/logout", { method:"POST", body:"{}" });
    }catch{}
    clearAdminToken();
    dbg({ step:"logout", tokenAfter: !!getAdminToken() });
    $("msg").textContent = "✅ Logged out";
  };

  $("loginBtn").onclick = async ()=>{
    $("msg").textContent = "Logging in...";
    dbg("Starting login...");

    try{
      const email = ($("email").value || "").trim();
      const password = $("pass").value || "";
      if(!email || !password) throw new Error("missing_email_password");

      // Call login
      const loginRes = await fetch("/api/book/course-admin/login", {
        method:"POST",
        credentials:"include",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ email, password })
      });

      const loginText = await loginRes.text();
      let loginData = {};
      try { loginData = JSON.parse(loginText); }
      catch { loginData = { _nonJson: String(loginText || "").slice(0, 300) }; }

      // Save token if present (optional)
      if (loginData && (loginData.token || loginData.accessToken)) {
        setAdminToken(String(loginData.token || loginData.accessToken));
      }

      dbg({
        step:"login_response",
        status: loginRes.status,
        ok: loginRes.ok,
        data: loginData,
        tokenSaved: !!getAdminToken(),
        tokenPreview: (getAdminToken() || "").slice(0, 20) + (getAdminToken() ? "…" : "")
      });

      if(!loginRes.ok) throw new Error(loginData.error || ("HTTP "+loginRes.status));

      // Immediately test /me (this tells us EXACTLY why you're being kicked out)
      const meRes = await fetch("/api/book/course-admin/me", {
        method:"GET",
        credentials:"include",
        headers:{
          "Content-Type":"application/json",
          ...(getAdminToken() ? { "Authorization":"Bearer " + getAdminToken() } : {})
        }
      });

      const meText = await meRes.text();
      let meData = {};
      try { meData = JSON.parse(meText); }
      catch { meData = { _nonJson: String(meText || "").slice(0, 300) }; }

      dbg({
        step:"me_response",
        status: meRes.status,
        ok: meRes.ok,
        meData
      });

      if(!meRes.ok){
        $("msg").textContent = "❌ Logged in but /me failed. See debug box.";
        return;
      }

      $("msg").textContent = "✅ Logged in";
      setTimeout(()=> location.href = "/course-admin.html", 250);
    }catch(e){
      $("msg").textContent = "❌ " + e.message;
      dbg({ step:"error", message: String(e.message || e) });
    }
  };
</script>
</body>
</html>
