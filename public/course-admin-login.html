<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>TeeRadar — Course Admin Login</title>
  <link rel="icon" type="image/png" href="/assets/icon-192.png" />
  <style>
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,sans-serif;
      background:#f4f7fb;
      color:#0f172a;
      display:flex;
      align-items:center;
      justify-content:center;
      height:100vh;
    }
    .card{
      background:#fff;
      border:1px solid #e2e8f0;
      border-radius:14px;
      padding:28px;
      width:100%;
      max-width:420px;
    }
    h2{margin:0 0 8px;text-align:center}
    p{color:#64748b;font-size:14px;text-align:center}
    label{display:block;margin-top:14px;font-size:13px;color:#475569}
    input{
      width:100%;
      padding:12px;
      border:1px solid #cbd5e1;
      border-radius:10px;
      margin-top:6px;
      font-size:14px;
    }
    button{
      margin-top:20px;
      width:100%;
      padding:12px;
      border:0;
      border-radius:12px;
      background:#00796b;
      color:#fff;
      font-weight:700;
      cursor:pointer;
    }
    .msg{
      margin-top:12px;
      font-size:13px;
      text-align:center;
      color:#b91c1c;
    }

    /* ✅ Forgot password UI */
    .forgotRow{
      margin-top:10px;
      text-align:center;
    }
    .linkBtn{
      background:transparent;
      border:0;
      padding:0;
      margin:0;
      color:#00796b;
      font-weight:700;
      cursor:pointer;
      width:auto;
    }
    .linkBtn:hover{ text-decoration: underline; }

    .forgotWrap{
      margin-top:12px;
      padding-top:12px;
      border-top:1px solid #e2e8f0;
    }
    .secondaryBtn{
      margin-top:12px;
      width:100%;
      padding:12px;
      border:1px solid #cbd5e1;
      border-radius:12px;
      background:#fff;
      color:#0f172a;
      font-weight:700;
      cursor:pointer;
    }
        .homeLink{
  position:fixed;
  top:calc(env(safe-area-inset-top) + 60px);
  left:20px;
  background:#fff;
  color:#00796b;
  text-decoration:none;
  font-weight:700;
  padding:10px 16px;
  border-radius:999px;
  border:1px solid #cbd5e1;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
  z-index:1000;
}

.homeLink:hover{
  background:#f8fafc;
}

@media (max-width:720px){
  .homeLink{
    top:calc(env(safe-area-inset-top) + 52px);
    left:12px;
    font-size:14px;
    padding:8px 14px;
  }
}
  </style>
</head>
<body>
  
  <a href="/" class="homeLink">← Home</a>
  
  <div style="

    position:absolute;

    top:80px;

    text-align:center;

    width:100%;

    font-size:28px;

    font-weight:800;

    color:#00796b;

  ">

    TeeRadar

  </div>
  
  <div class="card">
    <h2>Course Admin</h2>
    <p>Sign in to manage tee times and bookings</p>

    <label>Email</label>
    <input id="email" type="email" placeholder="admin@course.com" />

    <label>Password</label>
    <input id="password" type="password" placeholder="••••••••" />

    <button id="loginBtn">Sign in</button>

    <!-- ✅ Forgot password -->
    <div class="forgotRow">
      <button type="button" id="forgotBtn" class="linkBtn">Forgot password?</button>
    </div>

    <div id="forgotWrap" class="forgotWrap" style="display:none;">
      <label style="margin-top:10px;">Reset email</label>
      <input id="forgotEmail" type="email" placeholder="admin@course.com" />
      <button type="button" id="forgotSendBtn" class="secondaryBtn">Send reset link</button>
    </div>

    <div id="msg" class="msg"></div>
  </div>

<script>
const msg = document.getElementById("msg");

/* ✅ Forgot password handlers */
const forgotBtn = document.getElementById("forgotBtn");
const forgotWrap = document.getElementById("forgotWrap");
const forgotEmail = document.getElementById("forgotEmail");
const forgotSendBtn = document.getElementById("forgotSendBtn");

forgotBtn.onclick = () => {
  const open = forgotWrap.style.display !== "none";
  forgotWrap.style.display = open ? "none" : "block";

  // prefill with login email if present
  const cur = document.getElementById("email").value.trim();
  if (!forgotEmail.value.trim() && cur) forgotEmail.value = cur;

  // reset message
  msg.style.color = "#b91c1c";
  msg.textContent = "";
};

forgotSendBtn.onclick = async () => {
  msg.style.color = "#0f172a";
  msg.textContent = "Sending reset link…";

  const email = (forgotEmail.value || "").trim() || (document.getElementById("email").value || "").trim();
  if (!email) {
    msg.style.color = "#b91c1c";
    msg.textContent = "Enter your email first";
    return;
  }

  try {
    const res = await fetch("/api/book/course-admin/forgot-password", {
      method: "POST",
      headers: { "content-type": "application/json" },
      credentials: "include",
      body: JSON.stringify({ email })
    });

    const data = await res.json().catch(() => ({}));

    if (!res.ok) {
      msg.style.color = "#b91c1c";
      msg.textContent = data.error || "Reset failed";
      return;
    }

    // ✅ Don't reveal if the email exists
    msg.style.color = "#00796b";
    msg.textContent = "✅ If that email exists, a reset link has been sent.";
    forgotWrap.style.display = "none";
  } catch (e) {
    msg.style.color = "#b91c1c";
    msg.textContent = "Network error";
  }
};

document.getElementById("loginBtn").onclick = async () => {
  msg.style.color = "#b91c1c";
  msg.textContent = "Signing in…";

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    msg.textContent = "Email and password required";
    return;
  }

  try {
    const res = await fetch("/api/book/course-admin/login", {
      method: "POST",
      headers: { "content-type": "application/json" },
      credentials: "include",
      body: JSON.stringify({ email, password })
    });

    const data = await res.json();

    if (!res.ok) {
      msg.textContent = data.error || "Login failed";
      return;
    }

    // ✅ persist token/slug so course-admin.html can auto-use it (no second login)
    const token = data.token || data.jwt || data.accessToken || "";
    const slug = data.slug || data.courseSlug || data.course_slug || "";

    if (token) localStorage.setItem("course_admin_token", token);
    if (slug) localStorage.setItem("course_admin_slug", slug);

    window.location.href = "/course-admin.html";
  } catch (e) {
    msg.textContent = "Network error";
  }
};
</script>
</body>
</html>
