<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <title>TeeRadar — Live Round</title>

  <link
    rel="icon"
    type="image/png"
    href="/assets/icon-192.png"
  />

  <script src="/capacitor.js"></script>

  <script>
    try {
      const runningInsideApp =
        window.Capacitor &&
        typeof window.Capacitor.isNativePlatform === "function" &&
        window.Capacitor.isNativePlatform();

      if (runningInsideApp) {
        document.documentElement.classList.add("app-mode");
      }
    } catch (error) {
      console.warn(
        "Capacitor detection failed:",
        error
      );
    }
  </script>

  <style>
    :root{
      --teal:#00796b;
      --teal-dark:#005e55;
      --bg:#f2f6f7;
      --card:#ffffff;
      --text:#10212a;
      --muted:#71818a;
      --border:#dfe8eb;
      --danger:#dc2626;
      --shadow:0 10px 28px rgba(21,50,60,.08);
    }

    *{
      box-sizing:border-box;
    }

    html,
    body{
      margin:0;
      min-height:100%;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background:var(--bg);
      color:var(--text);
    }

    body{
      padding-bottom:
        calc(92px + env(safe-area-inset-bottom,0px));
    }

    button,
    a{
      font:inherit;
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    /* Header */

    .live-header{
      position:sticky;
      top:0;
      z-index:100;

      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;

      padding:
        calc(env(safe-area-inset-top,0px) + 12px)
        15px
        12px;

      background:
        rgba(242,246,247,.96);

      border-bottom:
        1px solid rgba(210,222,227,.95);

      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
    }

    .live-back{
      display:grid;
      place-items:center;

      width:43px;
      height:43px;
      flex:0 0 43px;

      border:1px solid #dce7e9;
      border-radius:15px;

      background:#ffffff;
      color:var(--teal);

      font-size:23px;
      font-weight:900;

      box-shadow:
        0 6px 18px rgba(21,50,60,.07);
    }

    .live-header-copy{
      min-width:0;
      flex:1;
    }

    .live-header-copy span{
      display:block;

      color:#dc2626;

      font-size:10px;
      font-weight:950;
      letter-spacing:.08em;
    }

    .live-header-copy h1{
      margin:2px 0 0;

      overflow:hidden;

      font-size:20px;
      font-weight:950;
      line-height:1.1;

      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .live-refresh{
      display:grid;
      place-items:center;

      width:43px;
      height:43px;
      flex:0 0 43px;

      border:1px solid #dce7e9;
      border-radius:15px;

      background:#ffffff;
      color:var(--teal);

      font-size:18px;
      font-weight:900;

      cursor:pointer;

      box-shadow:
        0 6px 18px rgba(21,50,60,.07);
    }

    /* Main */

    main{
      width:100%;
      max-width:760px;

      margin:0 auto;
      padding:14px;
    }

    /* Hero */

    .live-hero{
      position:relative;
      overflow:hidden;

      padding:20px;

      border-radius:26px;

      background:
        linear-gradient(
          145deg,
          #061d2b,
          #00796b
        );

      color:#ffffff;

      box-shadow:
        0 16px 36px rgba(0,121,107,.22);
    }

    .live-hero::after{
      content:"";

      position:absolute;
      top:-70px;
      right:-55px;

      width:190px;
      height:190px;

      border-radius:50%;

      background:
        rgba(255,255,255,.07);
    }

    .live-status-row{
      position:relative;
      z-index:1;

      display:flex;
      align-items:center;
      gap:7px;

      margin-bottom:10px;

      font-size:10px;
      font-weight:950;
      letter-spacing:.08em;
    }

    .live-dot{
      width:8px;
      height:8px;

      border-radius:50%;

      background:#ef4444;

      box-shadow:
        0 0 0 4px rgba(239,68,68,.18);
    }

    .live-hero-main{
      position:relative;
      z-index:1;

      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:18px;
    }

    .live-course{
      min-width:0;
      flex:1;
    }

    .live-course h2{
      margin:0;

      font-size:23px;
      font-weight:950;
      line-height:1.08;
      letter-spacing:-.03em;
    }

    .live-course-meta{
      margin-top:7px;

      color:
        rgba(255,255,255,.8);

      font-size:12px;
      font-weight:750;
      line-height:1.4;
    }

    .live-score-wrap{
      flex:0 0 auto;
      text-align:right;
    }

    .live-score{
      font-size:48px;
      font-weight:1000;
      line-height:.95;
      letter-spacing:-.07em;
    }

    .live-score-label{
      margin-top:5px;

      color:
        rgba(255,255,255,.75);

      font-size:10px;
      font-weight:850;
    }

    .live-progress{
      position:relative;
      z-index:1;

      display:grid;
      grid-template-columns:
        repeat(3,minmax(0,1fr));

      gap:8px;

      margin-top:18px;
    }

    .live-stat{
      padding:10px;

      border:
        1px solid rgba(255,255,255,.16);
      border-radius:15px;

      background:
        rgba(255,255,255,.10);
    }

    .live-stat strong{
      display:block;

      font-size:16px;
      font-weight:950;
    }

    .live-stat span{
      display:block;

      margin-top:2px;

      color:
        rgba(255,255,255,.72);

      font-size:9px;
      font-weight:800;
    }

    /* Cards */

    .card{
      margin-top:13px;
      padding:16px;

      border:1px solid var(--border);
      border-radius:22px;

      background:#ffffff;

      box-shadow:var(--shadow);
    }

    .card-header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;

      margin-bottom:13px;
    }

    .card-header h2{
      margin:0;

      font-size:17px;
      font-weight:950;
    }

    .card-header span{
      color:var(--muted);

      font-size:10px;
      font-weight:800;
    }

    /* Hole cards */

    .holes-grid{
      display:grid;
      grid-template-columns:
        repeat(3,minmax(0,1fr));

      gap:8px;
    }

    .hole-card{
      min-height:88px;

      padding:10px;

      border:1px solid var(--border);
      border-radius:16px;

      background:#f8fafb;
    }

    .hole-card.current{
      border-color:
        rgba(0,121,107,.45);

      background:#edf8f6;

      box-shadow:
        inset 0 0 0 1px
        rgba(0,121,107,.08);
    }

    .hole-card.completed{
      background:#ffffff;
    }

    .hole-number{
      color:var(--muted);

      font-size:9px;
      font-weight:900;
      text-transform:uppercase;
    }

    .hole-score{
      margin-top:5px;

      font-size:22px;
      font-weight:950;
      line-height:1;
    }

    .hole-meta{
      margin-top:5px;

      color:var(--muted);

      font-size:9px;
      font-weight:800;
      line-height:1.3;
    }

    /* Summary */

    .summary-grid{
      display:grid;
      grid-template-columns:
        repeat(2,minmax(0,1fr));

      gap:9px;
    }

    .summary-item{
      padding:13px;

      border-radius:16px;

      background:#f8fafb;
      border:1px solid var(--border);
    }

    .summary-item span{
      display:block;

      color:var(--muted);

      font-size:9px;
      font-weight:850;
      text-transform:uppercase;
      letter-spacing:.04em;
    }

    .summary-item strong{
      display:block;

      margin-top:5px;

      font-size:20px;
      font-weight:950;
    }

    /* Loading/error */

    .state-card{
      padding:22px;

      border:1px solid var(--border);
      border-radius:22px;

      background:#ffffff;

      color:var(--muted);

      font-size:13px;
      font-weight:750;
      line-height:1.45;

      text-align:center;

      box-shadow:var(--shadow);
    }

    /* Bottom nav */

    .app-bottom-nav{
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      z-index:99999;

      display:grid;
      grid-template-columns:
        repeat(5,minmax(0,1fr));

      width:100%;
      max-width:760px;

      min-height:78px;

      margin:0 auto;

      padding:
        7px
        6px
        calc(
          env(safe-area-inset-bottom,0px)
          + 7px
        );

      border-top:
        1px solid #d7e2e5;

      background:
        rgba(255,255,255,.98);

      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);

      box-shadow:
        0 -8px 25px
        rgba(21,50,60,.12);
    }

    .app-bottom-link{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:4px;

      min-height:56px;

      color:#71818a;

      font-size:10px;
      font-weight:800;

      text-decoration:none;
    }

    .app-bottom-link-icon{
      font-size:21px;
      line-height:1;
    }

    .app-bottom-link.active{
      color:#00796b;
    }

    .app-bottom-play{
      transform:translateY(-14px);
    }

    .app-bottom-play
    .app-bottom-link-icon{
      display:grid;
      place-items:center;

      width:58px;
      height:58px;

      border:
        5px solid #f2f6f7;
      border-radius:50%;

      background:
        linear-gradient(
          135deg,
          #00796b,
          #005e55
        );

      color:#ffffff;

      font-size:25px;

      box-shadow:
        0 10px 24px
        rgba(0,121,107,.30);
    }

    @media(min-width:700px){
      main{
        padding:20px 22px;
      }

      .holes-grid{
        grid-template-columns:
          repeat(6,minmax(0,1fr));
      }

      .summary-grid{
        grid-template-columns:
          repeat(4,minmax(0,1fr));
      }
    }
  </style>
</head>

<body>

  <script>
    const API_BASE =
      window.TEERADAR_API_BASE ||
      localStorage.getItem(
        "teeradar_backend_url"
      ) ||
      "https://teeradar.com.au";

    let refreshTimer = null;

    function getToken(){
      return (
        localStorage.getItem(
          "teeradar_jwt"
        ) ||
        localStorage.getItem(
          "teeradar_token"
        ) ||
        localStorage.getItem(
          "token"
        ) ||
        localStorage.getItem(
          "authToken"
        ) ||
        ""
      ).trim();
    }

    function getParams(){
      const params =
        new URLSearchParams(
          window.location.search
        );

      return {
        roundId:
          Number(
            params.get("roundId") || 0
          ),

        friendUserId:
          Number(
            params.get(
              "friendUserId"
            ) || 0
          )
      };
    }

    function escapeHtml(value){
      return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function scoreLabel(value){
      const n = Number(value);

      if (!Number.isFinite(n)) {
        return "E";
      }

      if (n === 0) {
        return "E";
      }

      return n > 0
        ? `+${n}`
        : String(n);
    }

    function getHoleScore(hole){
      if (!hole) return null;

      if (
        hole.strokes !== null &&
        typeof hole.strokes !==
          "undefined" &&
        Number.isFinite(
          Number(hole.strokes)
        )
      ) {
        return Number(hole.strokes);
      }

      const map =
        hole.strokes_by_player;

      if (
        map &&
        typeof map === "object" &&
        Number.isFinite(
          Number(map["1"])
        )
      ) {
        return Number(map["1"]);
      }

      return null;
    }

    function getHolePutts(hole){
      if (!hole) return null;

      if (
        hole.putts !== null &&
        typeof hole.putts !==
          "undefined" &&
        Number.isFinite(
          Number(hole.putts)
        )
      ) {
        return Number(hole.putts);
      }

      const map =
        hole.putts_by_player;

      if (
        map &&
        typeof map === "object" &&
        Number.isFinite(
          Number(map["1"])
        )
      ) {
        return Number(map["1"]);
      }

      return null;
    }

    function calculateProgress(
      round,
      holes
    ){
      let totalStrokes = 0;
      let totalPutts = 0;
      let playedPar = 0;
      let holesCompleted = 0;
      let lastCompletedHole = 0;

      for (const hole of holes || []) {
        const strokes =
          getHoleScore(hole);

        if (!Number.isFinite(strokes)) {
          continue;
        }

        holesCompleted += 1;

        totalStrokes +=
          strokes;

        lastCompletedHole =
          Math.max(
            lastCompletedHole,
            Number(
              hole.hole_number || 0
            )
          );

        const par =
          Number(hole.par);

        if (Number.isFinite(par)) {
          playedPar += par;
        }

        const putts =
          getHolePutts(hole);

        if (Number.isFinite(putts)) {
          totalPutts += putts;
        }
      }

      const totalHoles =
        Number(round?.holes || 18);

      const currentHole =
        Math.min(
          Math.max(
            lastCompletedHole + 1,
            1
          ),
          totalHoles
        );

      const toPar =
        totalStrokes - playedPar;

      return {
        totalStrokes,
        totalPutts,
        playedPar,
        holesCompleted,
        lastCompletedHole,
        currentHole,
        totalHoles,
        toPar
      };
    }

    function renderHoles(
      round,
      holes,
      progress
    ){
      const grid =
        document.getElementById(
          "holesGrid"
        );

      if (!grid) return;

      const holesMap =
        new Map();

      for (const hole of holes || []) {
        holesMap.set(
          Number(hole.hole_number),
          hole
        );
      }

      const html = [];

      for (
        let i = 1;
        i <= progress.totalHoles;
        i++
      ) {
        const hole =
          holesMap.get(i) || {};

        const strokes =
          getHoleScore(hole);

        const par =
          Number.isFinite(
            Number(hole.par)
          )
            ? Number(hole.par)
            : null;

        const putts =
          getHolePutts(hole);

        const completed =
          Number.isFinite(strokes);

        const current =
          i === progress.currentHole &&
          progress.holesCompleted <
            progress.totalHoles;

        let className =
          "hole-card";

        if (completed) {
          className +=
            " completed";
        }

        if (current) {
          className +=
            " current";
        }

        let holeToPar = null;

        if (
          completed &&
          Number.isFinite(par)
        ) {
          holeToPar =
            strokes - par;
        }

        html.push(`
          <div class="${className}">

            <div class="hole-number">
              Hole ${i}
            </div>

            <div class="hole-score">
              ${
                completed
                  ? escapeHtml(
                      scoreLabel(
                        holeToPar
                      )
                    )
                  : "—"
              }
            </div>

            <div class="hole-meta">
              ${
                par !== null
                  ? `Par ${par}`
                  : "Par —"
              }
              ${
                completed
                  ? `<br>${strokes} strokes`
                  : ""
              }
              ${
                Number.isFinite(putts)
                  ? `<br>${putts} putts`
                  : ""
              }
            </div>

          </div>
        `);
      }

      grid.innerHTML =
        html.join("");
    }

    function renderRound(
      round,
      holes,
      friendName
    ){
      const progress =
        calculateProgress(
          round,
          holes
        );

      const name =
        friendName ||
        "Friend";

      document.getElementById(
        "liveFriendName"
      ).textContent =
        name;

      document.getElementById(
        "liveCourse"
      ).textContent =
        round.course ||
        "Golf Course";

      const metaParts = [];

      if (round.layout) {
        metaParts.push(
          round.layout
        );
      }

      if (round.state) {
        metaParts.push(
          round.state
        );
      }

      metaParts.push(
        `${progress.totalHoles} holes`
      );

      document.getElementById(
        "liveCourseMeta"
      ).textContent =
        metaParts.join(" • ");

      document.getElementById(
        "liveScore"
      ).textContent =
        scoreLabel(
          progress.toPar
        );

      document.getElementById(
        "liveHole"
      ).textContent =
        progress.holesCompleted >=
          progress.totalHoles
          ? progress.totalHoles
          : progress.currentHole;

      document.getElementById(
        "liveStrokes"
      ).textContent =
        progress.holesCompleted
          ? progress.totalStrokes
          : "—";

      document.getElementById(
        "livePutts"
      ).textContent =
        progress.holesCompleted
          ? progress.totalPutts
          : "—";

      document.getElementById(
        "summaryHoles"
      ).textContent =
        `${progress.holesCompleted}/${progress.totalHoles}`;

      document.getElementById(
        "summaryToPar"
      ).textContent =
        scoreLabel(
          progress.toPar
        );

      document.getElementById(
        "summaryStrokes"
      ).textContent =
        progress.holesCompleted
          ? progress.totalStrokes
          : "—";

      document.getElementById(
        "summaryPutts"
      ).textContent =
        progress.holesCompleted
          ? progress.totalPutts
          : "—";

      renderHoles(
        round,
        holes,
        progress
      );

      document.getElementById(
        "lastUpdated"
      ).textContent =
        "Updated " +
        new Date().toLocaleTimeString(
          "en-AU",
          {
            hour:"numeric",
            minute:"2-digit",
            second:"2-digit"
          }
        );
    }

    async function loadLiveRound(){
      const state =
        document.getElementById(
          "liveState"
        );

      const content =
        document.getElementById(
          "liveContent"
        );

      const {
        roundId,
        friendUserId
      } = getParams();

      const token =
        getToken();

      if (!token) {
        state.style.display =
          "block";

        content.style.display =
          "none";

        state.innerHTML =
          `Log in to follow your friends' live rounds.`;

        return;
      }

      if (
        !roundId ||
        !friendUserId
      ) {
        state.style.display =
          "block";

        content.style.display =
          "none";

        state.textContent =
          "This live round link is incomplete.";

        return;
      }

      try {
        const response =
          await fetch(
            `${API_BASE}/api/rounds/friend/${encodeURIComponent(friendUserId)}/round/${encodeURIComponent(roundId)}`,
            {
              method:"GET",

              headers:{
                Authorization:
                  `Bearer ${token}`
              }
            }
          );

        const data =
          await response
            .json()
            .catch(() => ({}));

        if (
          !response.ok ||
          !data?.ok
        ) {
          throw new Error(
            data?.error ||
            "live_round_failed"
          );
        }

        const round =
          data.round || {};

        const holes =
          Array.isArray(data.holes)
            ? data.holes
            : [];

        /*
         * The friend-round endpoint currently doesn't return
         * the friend's display name, so use the live-round
         * endpoint to resolve it.
         */
        let friendName =
          "Friend";

        try {
          const liveResponse =
            await fetch(
              `${API_BASE}/api/friends/live-rounds`,
              {
                headers:{
                  Authorization:
                    `Bearer ${token}`
                }
              }
            );

          const liveData =
            await liveResponse
              .json()
              .catch(() => ({}));

          const matching =
            Array.isArray(
              liveData?.rounds
            )
              ? liveData.rounds.find(
                  item =>
                    Number(
                      item.round_id
                    ) ===
                      roundId &&
                    Number(
                      item.friend_user_id
                    ) ===
                      friendUserId
                )
              : null;

          if (
            matching?.friend_name
          ) {
            friendName =
              matching.friend_name;
          }

        } catch (error) {
          // Name lookup is optional.
        }

        state.style.display =
          "none";

        content.style.display =
          "block";

        renderRound(
          round,
          holes,
          friendName
        );

      } catch (error) {
        console.warn(
          "loadLiveRound failed:",
          error
        );

        state.style.display =
          "block";

        content.style.display =
          "none";

        if (
          String(
            error?.message || ""
          ) === "not_friends"
        ) {
          state.textContent =
            "You can only follow live rounds from accepted friends.";
        } else if (
          String(
            error?.message || ""
          ) ===
            "round_not_found"
        ) {
          state.textContent =
            "This round is no longer available.";
        } else {
          state.textContent =
            "Could not load this live round.";
        }
      }
    }

    const refreshBtn =
      document.getElementById(
        "liveRefreshBtn"
      );

    if (refreshBtn) {
      refreshBtn.addEventListener(
        "click",
        async () => {
          refreshBtn.disabled =
            true;

          try {
            await loadLiveRound();
          } finally {
            refreshBtn.disabled =
              false;
          }
        }
      );
    }

    /*
     * Initial load.
     */
    loadLiveRound();

    /*
     * Refresh live scores automatically every 10 seconds.
     */
    refreshTimer =
      setInterval(() => {
        loadLiveRound()
          .catch(() => {});
      }, 10000);

    /*
     * Stop unnecessary polling when the page is hidden.
     */
    document.addEventListener(
      "visibilitychange",
      () => {
        if (
          document.visibilityState ===
          "visible"
        ) {
          loadLiveRound()
            .catch(() => {});
        }
      }
    );
  </script>
</body>
</html>
