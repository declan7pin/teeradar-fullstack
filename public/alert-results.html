<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <title>TeeRadar — Alert results</title>

  <link
    rel="icon"
    type="image/png"
    href="/assets/icon-192.png"
  />

  <script src="/capacitor.js"></script>

  <script>
    try {
      const runningInsideApp =
        window.Capacitor &&
        typeof window.Capacitor.isNativePlatform === "function" &&
        window.Capacitor.isNativePlatform();

      if (runningInsideApp) {
        document.documentElement.classList.add("app-mode");
      }
    } catch {}
  </script>

  <style>
    :root{
      --teal:#00796b;
      --teal-dark:#005e55;
      --bg:#f2f6f7;
      --card:#ffffff;
      --text:#0f172a;
      --muted:#64748b;
      --border:#e2e8f0;
    }

    *{
      box-sizing:border-box;
    }

    html,
    body{
      margin:0;
      min-height:100%;

      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background:var(--bg);
      color:var(--text);
    }

    body{
      padding-bottom:
        calc(92px + env(safe-area-inset-bottom,0px));
    }

    header{
      position:sticky;
      top:0;
      z-index:100;

      background:
        linear-gradient(
          135deg,
          var(--teal),
          var(--teal-dark)
        );

      color:#ffffff;

      padding:
        calc(env(safe-area-inset-top,0px) + 13px)
        16px
        14px;

      box-shadow:
        0 4px 18px rgba(15,23,42,.12);
    }

    .header-inner{
      max-width:760px;

      margin:0 auto;

      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;

      min-width:0;

      font-weight:950;
      font-size:18px;
    }

    .brand img{
      width:38px;
      height:38px;

      border-radius:13px;

      background:#ffffff;

      object-fit:contain;
    }

    .home-btn{
      border:0;
      border-radius:14px;

      background:#ffffff;
      color:var(--teal-dark);

      padding:10px 13px;

      font-weight:900;
      cursor:pointer;
    }

    main{
      width:100%;
      max-width:760px;

      margin:0 auto;
      padding:16px 14px 30px;
    }

    .intro{
      background:var(--card);

      border:1px solid var(--border);
      border-radius:22px;

      padding:18px;

      box-shadow:
        0 9px 24px rgba(21,50,60,.07);

      margin-bottom:14px;
    }

    h1{
      margin:0 0 6px;

      font-size:23px;
      font-weight:950;
      line-height:1.15;
    }

    .sub{
      margin:0;

      color:var(--muted);

      font-size:13px;
      line-height:1.45;
    }

    .filters{
      display:flex;
      flex-wrap:wrap;
      gap:7px;

      margin-top:12px;
    }

    .pill{
      display:inline-flex;

      padding:6px 10px;

      border-radius:999px;

      background:#ecfdf5;
      border:1px solid rgba(16,185,129,.35);

      color:#065f46;

      font-size:11px;
      font-weight:850;
    }

    .list{
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .card{
      background:var(--card);

      border:1px solid var(--border);
      border-radius:20px;

      padding:16px;

      box-shadow:
        0 9px 24px rgba(21,50,60,.06);
    }

    .course-title{
      margin:0 0 5px;

      font-size:17px;
      font-weight:950;
    }

    .meta{
      color:var(--muted);

      font-size:12px;
      line-height:1.45;

      margin-bottom:10px;
    }

    .times{
      display:flex;
      flex-wrap:wrap;
      gap:7px;

      margin-bottom:12px;
    }

    .time-chip{
      border-radius:999px;

      padding:6px 10px;

      background:#f1f5f9;
      color:#334155;

      font-size:11px;
      font-weight:850;
    }

    .book-btn{
      display:flex;
      justify-content:center;
      align-items:center;

      width:100%;
      min-height:48px;

      border:0;
      border-radius:15px;

      background:var(--teal);
      color:#ffffff;

      padding:11px 16px;

      font-size:14px;
      font-weight:900;

      text-decoration:none;

      cursor:pointer;
    }

    .book-btn:active{
      background:var(--teal-dark);
      transform:scale(.98);
    }

    .empty{
      background:#ffffff;

      border:1px solid var(--border);
      border-radius:20px;

      padding:20px;

      color:var(--muted);

      text-align:center;

      font-size:13px;
      line-height:1.5;
    }

    .error{
      background:#fff7ed;

      border:1px solid #fed7aa;
      border-radius:20px;

      padding:16px;

      color:#9a3412;

      font-size:13px;
      font-weight:750;
      line-height:1.5;
    }

    .loading{
      text-align:center;
      padding:24px;

      color:var(--muted);

      font-size:13px;
      font-weight:750;
    }

    /* Bottom navigation */

    .app-bottom-nav{
      position:fixed;
      right:0;
      bottom:0;
      left:0;
      z-index:100000;

      display:grid;
      grid-template-columns:
        repeat(5,minmax(0,1fr));

      width:100%;
      max-width:760px;

      min-height:78px;

      margin:0 auto;

      padding:
        7px
        6px
        calc(env(safe-area-inset-bottom,0px) + 7px);

      border-top:
        1px solid #d7e2e5;

      background:
        rgba(255,255,255,.98);

      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);

      box-shadow:
        0 -8px 25px rgba(21,50,60,.12);
    }

    .app-bottom-link{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:4px;

      color:#71818a;

      font-size:10px;
      font-weight:800;

      text-decoration:none;
    }

    .app-bottom-link-icon{
      font-size:21px;
      line-height:1;
    }

    .app-bottom-link.active{
      color:#00796b;
    }

    .app-bottom-play{
      transform:translateY(-14px);
    }

    .app-bottom-play .app-bottom-link-icon{
      display:grid;
      place-items:center;

      width:58px;
      height:58px;

      border:
        5px solid #f2f6f7;
      border-radius:50%;

      background:
        linear-gradient(
          135deg,
          #00796b,
          #005e55
        );

      color:#ffffff;

      font-size:25px;

      box-shadow:
        0 10px 24px rgba(0,121,107,.3);
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">

    <div class="brand">
      <img
        src="/assets/DBC5197C-F872-4ACB-921E-649F590A1030.png"
        alt="TeeRadar"
      />

      <span>TeeRadar alerts</span>
    </div>

    <button
      class="home-btn"
      type="button"
      onclick="window.location.href='/index.html'"
    >
      Home
    </button>

  </div>
</header>

<main>

  <section class="intro">
    <h1 id="alertTitle">
      Tee time alert
    </h1>

    <p
      class="sub"
      id="alertBody"
    >
      Loading your tee time results…
    </p>

    <div
      class="filters"
      id="alertFilters"
    ></div>
  </section>

  <section
    class="list"
    id="resultsList"
  >
    <div class="loading">
      Loading available tee times…
    </div>
  </section>

</main>

<nav
  class="app-bottom-nav"
  aria-label="TeeRadar app navigation"
>

  <a
    class="app-bottom-link active"
    href="/index.html"
  >
    <span class="app-bottom-link-icon">⌂</span>
    <span>Home</span>
  </a>

  <a
    class="app-bottom-link"
    href="/book.html"
  >
    <span class="app-bottom-link-icon">⌕</span>
    <span>Search</span>
  </a>

  <a
    class="app-bottom-link app-bottom-play"
    href="/my-rounds.html"
  >
    <span class="app-bottom-link-icon">⚑</span>
    <span>Play</span>
  </a>

  <a
    class="app-bottom-link"
    href="/friends.html"
  >
    <span class="app-bottom-link-icon">👥</span>
    <span>Friends</span>
  </a>

  <a
    class="app-bottom-link"
    href="/account.html"
  >
    <span class="app-bottom-link-icon">●</span>
    <span>Account</span>
  </a>

</nav>

<script>
const API_BASE =
  window.TEERADAR_API_BASE ||
  localStorage.getItem(
    "teeradar_backend_url"
  ) ||
  "https://teeradar.com.au";

function escapeHtml(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function getNotificationId(){
  const params =
    new URLSearchParams(
      window.location.search
    );

  return Number(
    params.get("notificationId") || 0
  );
}

function getEmail(){
  return String(
    localStorage.getItem(
      "teeradar_user_email"
    ) ||
    localStorage.getItem(
      "teeradar_email"
    ) ||
    localStorage.getItem(
      "email"
    ) ||
    ""
  )
    .trim()
    .toLowerCase();
}

function formatDate(value){
  if (!value) return "";

  const d =
    new Date(value);

  if (Number.isNaN(d.getTime())) {
    return String(value);
  }

  return d.toLocaleDateString(
    "en-AU",
    {
      weekday:"short",
      day:"numeric",
      month:"short",
      year:"numeric"
    }
  );
}

function normaliseSlots(value){
  if (!Array.isArray(value)) {
    return [];
  }

  return value;
}

function getSlotTime(slot){
  if (!slot) return "";

  if (typeof slot === "string") {
    return slot;
  }

  return String(
    slot.time ||
    slot.tee_time ||
    slot.teeTime ||
    slot.start_time ||
    slot.startTime ||
    ""
  ).trim();
}

function getBookingUrl(item, firstSlot){
  return String(
    item?.bookingUrl ||
    item?.booking_url ||
    item?.bookUrl ||
    item?.url ||
    item?.link ||
    firstSlot?.bookingUrl ||
    firstSlot?.booking_url ||
    firstSlot?.bookUrl ||
    firstSlot?.url ||
    firstSlot?.link ||
    firstSlot?.href ||
    ""
  ).trim();
}

function makeSafeBookingUrl(url){
  if (!url) {
    return "/book.html";
  }

  try {
    const parsed =
      new URL(
        url,
        window.location.origin
      );

    if (
      parsed.protocol === "http:" ||
      parsed.protocol === "https:"
    ) {
      return parsed.href;
    }
  } catch {}

  if (url.startsWith("/")) {
    return url;
  }

  return "/book.html";
}

function buildResultCards(notification){
  const list =
    document.getElementById(
      "resultsList"
    );

  const filters =
    document.getElementById(
      "alertFilters"
    );

  const meta =
    notification?.meta &&
    typeof notification.meta === "object"
      ? notification.meta
      : {};

  /*
   * TeeRadar has used a few different shapes for alert
   * payloads over time, so support all of them.
   */
  let results = [];

  if (Array.isArray(meta.results)) {
    results = meta.results;
  } else if (Array.isArray(meta.hits)) {
    results = meta.hits;
  } else if (Array.isArray(meta.courses)) {
    results = meta.courses;
  } else if (
    meta.course ||
    meta.course_name ||
    meta.courseName
  ) {
    results = [meta];
  }

  /*
   * Useful alert details at top.
   */
  const date =
    meta.date ||
    meta.play_date ||
    meta.playDate ||
    "";

  const holes =
    meta.holes ||
    meta.preferred_holes ||
    "";

  const partySize =
    meta.partySize ||
    meta.party_size ||
    meta.preferred_party_size ||
    "";

  const pills = [];

  if (date) {
    pills.push(
      `<span class="pill">${escapeHtml(formatDate(date))}</span>`
    );
  }

  if (holes) {
    pills.push(
      `<span class="pill">${escapeHtml(holes)} holes</span>`
    );
  }

  if (partySize) {
    pills.push(
      `<span class="pill">${escapeHtml(partySize)} player${Number(partySize) === 1 ? "" : "s"}</span>`
    );
  }

  filters.innerHTML =
    pills.join("");

  /*
   * If the notification did not store structured results,
   * do not throw an error. Give the golfer a useful route
   * back to the TeeRadar search.
   */
  if (!results.length) {
    list.innerHTML = `
      <div class="empty">
        <strong>
          This alert does not contain saved tee-time details.
        </strong>

        <div style="margin-top:7px;">
          The alert itself is valid, but this older notification
          was created without the individual tee times attached.
        </div>

        <a
          class="book-btn"
          href="/book.html"
          style="margin-top:15px;"
        >
          Search current tee times
        </a>
      </div>
    `;

    return;
  }

  list.innerHTML =
    results.map((item) => {

      const course =
        String(
          item.course_name ||
          item.courseName ||
          item.course ||
          "Golf Course"
        );

      const itemDate =
        item.date ||
        item.play_date ||
        item.playDate ||
        date ||
        "";

      const slots =
        normaliseSlots(
          item.slots ||
          item.results ||
          item.times ||
          []
        );

      const firstSlot =
        slots[0] || null;

      const bookingUrl =
        makeSafeBookingUrl(
          getBookingUrl(
            item,
            firstSlot
          )
        );

      const times =
        slots
          .map(getSlotTime)
          .filter(Boolean);

      const state =
        String(
          item.state ||
          meta.state ||
          ""
        );

      const layout =
        String(
          item.layout ||
          ""
        );

      const metaText =
        [
          itemDate
            ? formatDate(itemDate)
            : "",
          state,
          layout
        ]
          .filter(Boolean)
          .join(" • ");

      const timeHtml =
        times.length
          ? `
            <div class="times">
              ${times
                .slice(0, 20)
                .map(
                  time =>
                    `<span class="time-chip">${escapeHtml(time)}</span>`
                )
                .join("")}
            </div>
          `
          : "";

      return `
        <article class="card">

          <h2 class="course-title">
            ${escapeHtml(course)}
          </h2>

          ${
            metaText
              ? `<div class="meta">${escapeHtml(metaText)}</div>`
              : ""
          }

          ${timeHtml}

          <a
            class="book-btn"
            href="${escapeHtml(bookingUrl)}"
          >
            View &amp; book
          </a>

        </article>
      `;
    })
    .join("");
}

async function loadAlertResults(){
  const notificationId =
    getNotificationId();

  const email =
    getEmail();

  const title =
    document.getElementById(
      "alertTitle"
    );

  const body =
    document.getElementById(
      "alertBody"
    );

  const list =
    document.getElementById(
      "resultsList"
    );

  if (!notificationId) {
    list.innerHTML = `
      <div class="error">
        This alert link is missing its notification ID.
      </div>
    `;

    return;
  }

  if (!email) {
    list.innerHTML = `
      <div class="error">
        Please log in to TeeRadar to view this alert.
      </div>
    `;

    return;
  }

  try {
    const response =
      await fetch(
        `${API_BASE}/api/push/notifications/${encodeURIComponent(notificationId)}?email=${encodeURIComponent(email)}`
      );

    const data =
      await response
        .json()
        .catch(() => ({}));

    if (
      !response.ok ||
      !data?.ok ||
      !data?.notification
    ) {
      throw new Error(
        data?.error ||
        "notification_load_failed"
      );
    }

    const notification =
      data.notification;

    title.textContent =
      notification.title ||
      "Tee time alert";

    body.textContent =
      notification.body ||
      "New tee times match your TeeRadar preferences.";

    buildResultCards(
      notification
    );

  } catch (error) {
    console.error(
      "loadAlertResults failed:",
      error
    );

    list.innerHTML = `
      <div class="error">
        Could not load this alert.

        <div style="margin-top:8px;font-weight:500;">
          ${escapeHtml(error?.message || "Unknown error")}
        </div>
      </div>
    `;
  }
}

loadAlertResults();
</script>

</body>
</html>
