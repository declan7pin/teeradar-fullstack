<!-- public/book-course.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TeeRadar Booking — Course</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:0;background:#f4f7fb;color:#0f172a}
    .wrap{max-width:900px;margin:24px auto;padding:0 16px}
    .card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px}
    .muted{color:#64748b;font-size:13px}
    code{background:#f1f5f9;padding:2px 6px;border-radius:8px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h2 id="name">Loading…</h2>
      <div id="notes" class="muted"></div>
      <p class="muted" style="margin-top:12px">
        Slug: <code id="slug"></code>
      </p>
      <p class="muted">
        Next step: add times + bookings (we’ll do that after Hillview/Marri Park are created).
      </p>
    </div>
  </div>

<script>
  async function j(url) {
    const res = await fetch(url);
    const data = await res.json().catch(()=> ({}));
    if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
    return data;
  }

  const slug = location.pathname.split("/").pop().toLowerCase();
  document.getElementById("slug").textContent = slug;

  (async () => {
    try {
      const out = await j("/api/book/course/" + encodeURIComponent(slug));
      document.getElementById("name").textContent = out.course.name;
      document.getElementById("notes").textContent = out.course.notes || "";
      document.title = "TeeRadar Booking — " + out.course.name;
    } catch (e) {
      document.getElementById("name").textContent = "Course not found";
      document.getElementById("notes").textContent = "Create it in /book/admin first.";
    }
  })();
</script>
</body>
</html>
