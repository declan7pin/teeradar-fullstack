<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TeeRadar — Reset Course Admin Password</title>
  <link rel="icon" type="image/png" href="/assets/icon-192.png" />
  <style>
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,sans-serif;
      background:#f4f7fb;
      color:#0f172a;
      display:flex;
      align-items:center;
      justify-content:center;
      height:100vh;
    }
    .card{
      background:#fff;
      border:1px solid #e2e8f0;
      border-radius:14px;
      padding:28px;
      width:100%;
      max-width:420px;
    }
    h2{margin:0 0 8px;text-align:center}
    p{color:#64748b;font-size:14px;text-align:center;margin:0 0 8px}
    label{display:block;margin-top:14px;font-size:13px;color:#475569}
    input{
      width:100%;
      padding:12px;
      border:1px solid #cbd5e1;
      border-radius:10px;
      margin-top:6px;
      font-size:14px;
    }
    button{
      margin-top:18px;
      width:100%;
      padding:12px;
      border:0;
      border-radius:12px;
      background:#00796b;
      color:#fff;
      font-weight:700;
      cursor:pointer;
    }
    .msg{
      margin-top:12px;
      font-size:13px;
      text-align:center;
      color:#b91c1c;
      min-height:18px;
    }
    .ok{ color:#166534; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Reset password</h2>
    <p>Enter a new password for your Course Admin account.</p>

    <label>New password</label>
    <input id="p1" type="password" placeholder="New password" />

    <label>Confirm password</label>
    <input id="p2" type="password" placeholder="Confirm password" />

    <button id="saveBtn">Update password</button>
    <div id="msg" class="msg"></div>
  </div>

<script>
const msg = document.getElementById("msg");

function getToken() {
  const u = new URL(window.location.href);
  return (u.searchParams.get("token") || "").trim();
}

document.getElementById("saveBtn").onclick = async () => {
  msg.classList.remove("ok");
  msg.textContent = "";

  const token = getToken();
  if (!token) {
    msg.textContent = "Missing token (invalid reset link).";
    return;
  }

  const p1 = document.getElementById("p1").value || "";
  const p2 = document.getElementById("p2").value || "";

  if (p1.length < 8) {
    msg.textContent = "Password must be at least 8 characters.";
    return;
  }
  if (p1 !== p2) {
    msg.textContent = "Passwords do not match.";
    return;
  }

  msg.textContent = "Updating…";

  try {
    const res = await fetch("/api/book/course-admin/reset-password", {
      method: "POST",
      headers: { "content-type": "application/json" },
      credentials: "include",
      body: JSON.stringify({ token, password: p1 })
    });

    const data = await res.json().catch(() => ({}));

    if (!res.ok || !data.ok) {
      msg.textContent = data.error || "Reset failed.";
      return;
    }

    msg.classList.add("ok");
    msg.textContent = "✅ Password updated. Redirecting to login…";
    setTimeout(() => { window.location.href = "/course-admin-login.html"; }, 900);
  } catch (e) {
    msg.textContent = "Network error";
  }
};
</script>
</body>
</html>
