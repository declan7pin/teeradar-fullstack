<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TeeRadar — Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --green: #006d4f;
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --pill: #e0f2fe;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      background: var(--green);
      color: #fff;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { margin: 0; font-size: 20px; }
    header button {
      border: none;
      background: #ffffff22;
      color: #fff;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      cursor: pointer;
    }
    main {
      max-width: 1100px;
      margin: 16px auto 32px;
      padding: 0 16px;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 14px 16px;
      box-shadow: 0 10px 30px rgba(15,23,42,0.06);
      border: 1px solid var(--border);
    }
    .card h2 {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin: 0 0 6px;
      color: var(--muted);
    }
    .card .value { font-size: 26px; font-weight: 600; }
    .card small { display:block; margin-top:4px; color:var(--muted); }
    .section-title { font-size: 16px; font-weight: 600; margin: 18px 0 10px; }
    .table-wrapper {
      background: var(--card);
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 30px rgba(15,23,42,0.06);
      overflow: auto;
    }
    table {
      width:100%;
      border-collapse: collapse;
      min-width: 500px;
      font-size: 13px;
    }
    thead { background:#f8fafc; }
    th, td {
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      white-space: nowrap;
    }
    th { font-weight: 600; color: var(--muted); }
    tbody tr:nth-child(even) { background:#f9fafb; }
    .pill {
      display:inline-flex;
      align-items:center;
      padding:2px 8px;
      border-radius:999px;
      background:var(--pill);
      font-size:11px;
      color:#0369a1;
    }
    .toolbar {
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin:6px 0 10px;
      gap:8px;
      flex-wrap:wrap;
    }
    .toolbar input {
      font-size:13px;
      padding:6px 10px;
      border-radius:999px;
      border:1px solid var(--border);
      min-width:160px;
    }
    .toolbar .hint { font-size:12px; color:var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>TeeRadar — Admin Dashboard</h1>
    <button onclick="window.location.href='/'">Return to site</button>
  </header>

  <main>
    <div class="cards">
      <div class="card">
        <h2>Total users</h2>
        <div class="value" id="stat-total-users">–</div>
        <small id="stat-last-signup">Last signup: –</small>
      </div>
      <div class="card">
        <h2>New users (7 days)</h2>
        <div class="value" id="stat-7day-users">–</div>
        <small class="hint">Based on created_at</small>
      </div>
      <div class="card">
        <h2>Preview</h2>
        <div class="value" id="stat-preview-count">–</div>
        <small>Users listed below</small>
      </div>
    </div>

    <div class="toolbar">
      <div class="section-title">Users</div>
      <div class="hint">
        Showing latest from <code>users</code>. Filter by email below.
      </div>
    </div>

    <div class="toolbar">
      <input type="search" id="search-input" placeholder="Filter by email…" />
      <div class="hint" id="row-count-hint">0 users</div>
    </div>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Email</th>
            <th>Home state</th>
            <th>Favourites</th>
            <th>Scrape days</th>
            <th>Time window</th>
            <th>Holes</th>
            <th>People</th>
            <th>Created at</th>
            <th>Last seen</th>
          </tr>
        </thead>
        <tbody id="users-body"></tbody>
      </table>
    </div>
  </main>

  <script>
    async function fetchJson(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error("Request failed " + res.status);
      return res.json();
    }

    function formatDate(value) {
      if (!value) return "–";
      const d = new Date(value);
      if (isNaN(d.getTime())) return value;
      return d.toLocaleString();
    }

    function formatFavourites(favs) {
      if (!Array.isArray(favs) || !favs.length) return "–";
      // Expect each item like { name, state }
      return favs
        .map((c) =>
          c.name
            ? c.name + (c.state ? ` (${c.state})` : "")
            : ""
        )
        .filter(Boolean)
        .join(", ");
    }

    function formatDays(days) {
      if (!days) return "–";
      if (Array.isArray(days)) return days.join(", ");
      return String(days);
    }

    function formatTimeWindow(from, to) {
      if (!from && !to) return "–";
      return `${from || "?"} – ${to || "?"}`;
    }

    function renderUsers(users) {
      const tbody = document.getElementById("users-body");
      tbody.innerHTML = "";
      users.forEach((u) => {
        const tr = document.createElement("tr");

        const idTd = document.createElement("td");
        idTd.textContent = u.id ?? "–";

        const emailTd = document.createElement("td");
        emailTd.innerHTML = u.email
          ? `<span class="pill">${u.email}</span>`
          : "–";

        const homeStateTd = document.createElement("td");
        homeStateTd.textContent = u.home_state || "–";

        const favsTd = document.createElement("td");
        favsTd.textContent = formatFavourites(u.favourite_courses);

        const daysTd = document.createElement("td");
        daysTd.textContent = formatDays(u.preferred_days);

        const timeTd = document.createElement("td");
        timeTd.textContent = formatTimeWindow(
          u.preferred_time_from,
          u.preferred_time_to
        );

        const holesTd = document.createElement("td");
        holesTd.textContent =
          u.preferred_holes != null ? String(u.preferred_holes) : "–";

        const peopleTd = document.createElement("td");
        peopleTd.textContent =
          u.preferred_party_size != null
            ? String(u.preferred_party_size)
            : "–";

        const createdTd = document.createElement("td");
        createdTd.textContent = formatDate(u.created_at);

        const lastLoginTd = document.createElement("td");
        // backend may send last_seen_at or last_login
        lastLoginTd.textContent = formatDate(u.last_seen_at || u.last_login);

        tr.appendChild(idTd);
        tr.appendChild(emailTd);
        tr.appendChild(homeStateTd);
        tr.appendChild(favsTd);
        tr.appendChild(daysTd);
        tr.appendChild(timeTd);
        tr.appendChild(holesTd);
        tr.appendChild(peopleTd);
        tr.appendChild(createdTd);
        tr.appendChild(lastLoginTd);
        tbody.appendChild(tr);
      });

      document.getElementById("row-count-hint").textContent =
        users.length + " users listed";
    }

    function applyFilter(allUsers) {
      const q = document.getElementById("search-input").value.toLowerCase();
      if (!q) {
        renderUsers(allUsers);
        return;
      }
      const filtered = allUsers.filter((u) =>
        (u.email || "").toLowerCase().includes(q)
      );
      renderUsers(filtered);
    }

    function computeSummary(allUsers) {
      const total = allUsers.length;
      let lastSignup = null;
      let last7Count = 0;

      const now = Date.now();
      const sevenDaysMs = 7 * 24 * 60 * 60 * 1000;

      allUsers.forEach((u) => {
        if (u.created_at) {
          const t = new Date(u.created_at).getTime();
          if (!isNaN(t)) {
            if (!lastSignup || t > lastSignup) lastSignup = t;
            if (now - t <= sevenDaysMs) last7Count += 1;
          }
        }
      });

      document.getElementById("stat-total-users").textContent =
        total.toString();
      document.getElementById("stat-7day-users").textContent =
        last7Count.toString();
      document.getElementById("stat-last-signup").textContent =
        "Last signup: " + (lastSignup ? formatDate(lastSignup) : "–");
      document.getElementById("stat-preview-count").textContent =
        total.toString();
    }

    async function init() {
      try {
        // Pull everything from one endpoint: /api/analytics/users
        const data = await fetchJson("/api/analytics/users");
        const allUsers = data.users || [];

        computeSummary(allUsers);
        renderUsers(allUsers);

        document
          .getElementById("search-input")
          .addEventListener("input", () => applyFilter(allUsers));
      } catch (err) {
        console.error(err);
        alert("Failed to load admin dashboard data. Check server logs.");
      }
    }

    init();
  </script>
</body>
</html>
