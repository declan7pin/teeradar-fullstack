<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TeeRadar — Friends</title>
  <link rel="icon" type="image/png" href="/assets/icon-192.png" />

  <style>
    :root{
      --teal:#00796b;
      --teal-dark:#005e55;
      --bg:#eef4f6;
      --card:#ffffff;
      --text:#0f172a;
      --muted:#64748b;
      --border:#dbe5ea;
      --ok:#16a34a;
      --danger:#dc2626;
      --shadow:0 18px 50px rgba(15,23,42,.08);
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    .wrap{
      max-width:860px;
      margin:0 auto;
      padding:20px 14px 80px;
    }

    .hero{
      background:linear-gradient(135deg,var(--teal),var(--teal-dark));
      color:#fff;
      border-radius:22px;
      padding:22px;
      box-shadow:var(--shadow);
      margin-bottom:16px;
    }

    .hero h1{
      margin:0 0 6px;
      font-size:28px;
    }

    .hero p{
      margin:0;
      opacity:.92;
      line-height:1.45;
    }

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      padding:16px;
      box-shadow:0 10px 35px rgba(15,23,42,.06);
      margin-bottom:14px;
    }

    h2{
      margin:0 0 12px;
      font-size:18px;
    }

    .row{
      display:flex;
      gap:10px;
      align-items:center;
    }

    input{
      width:100%;
      padding:12px 13px;
      border-radius:12px;
      border:1px solid var(--border);
      font:inherit;
    }

    button{
      border:0;
      border-radius:12px;
      padding:12px 14px;
      background:var(--teal);
      color:#fff;
      font-weight:700;
      cursor:pointer;
      white-space:nowrap;
    }

    button.secondary{
      background:#475569;
    }

    button.ghost{
      background:#e6f4f1;
      color:var(--teal-dark);
    }

    button.danger{
      background:#fee2e2;
      color:#991b1b;
    }

    button:disabled{
      opacity:.55;
      cursor:not-allowed;
    }

    .status{
      margin-top:10px;
      font-size:14px;
      color:var(--muted);
    }

    .list{
      display:grid;
      gap:10px;
    }

    .friend{
      border:1px solid var(--border);
      border-radius:14px;
      padding:13px;
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:center;
      background:#fff;
    }

    .friend strong{
      display:block;
      font-size:15px;
    }

    .friend span{
      display:block;
      color:var(--muted);
      font-size:13px;
      margin-top:3px;
    }

    .actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    .empty{
      color:var(--muted);
      font-size:14px;
      padding:8px 0;
    }

    .pill{
      display:inline-flex;
      align-items:center;
      gap:6px;
      background:#e6f4f1;
      color:var(--teal-dark);
      border-radius:999px;
      padding:6px 10px;
      font-size:13px;
      font-weight:700;
      margin-bottom:10px;
    }

    @media(max-width:640px){
      .row{
        flex-direction:column;
        align-items:stretch;
      }

      .friend{
        flex-direction:column;
        align-items:stretch;
      }

      .actions{
        justify-content:flex-start;
      }

      button{
        width:100%;
      }
    }
  </style>
</head>

<body>
  <main class="wrap">
    <div style="margin-bottom:12px;">
  <button class="ghost" onclick="window.location.href='/index.html'">
    ← Return Home
  </button>
</div>

<section class="hero">
      <h1>Friends</h1>
      <p>Add golf mates, share upcoming rounds, compare scorecards, and view each other’s stats.</p>
    </section>

    <section class="card">
      <div class="pill">Add a friend</div>
      <h2>Find a golfer</h2>

      <div class="row">
        <input id="friendSearch" type="email" placeholder="Search by email address" autocomplete="email" />
        <button id="searchBtn">Search</button>
      </div>

      <div id="searchStatus" class="status"></div>
      <div id="searchResults" class="list" style="margin-top:12px;"></div>
    </section>

    <section class="card">
      <h2>Friend requests</h2>
      <div id="requestsList" class="list">
        <div class="empty">Loading requests...</div>
      </div>
    </section>

    <section class="card">
      <h2>My friends</h2>
      <div id="friendsList" class="list">
        <div class="empty">Loading friends...</div>
      </div>
    </section>
  </main>

  <script src="/config.js"></script>
  <script>
    const API_BASE =
      window.TEERADAR_API_BASE ||
      localStorage.getItem("teeradar_backend_url") ||
      "";

    function getToken(){
  return (
    localStorage.getItem("teeradar_jwt") ||
    localStorage.getItem("token") ||
    localStorage.getItem("authToken") ||
    localStorage.getItem("teeradar_token") ||
    ""
  );
}

    function authHeaders(){
      const token = getToken();
      return {
        "Content-Type": "application/json",
        ...(token ? { Authorization: "Bearer " + token } : {})
      };
    }

    function escapeHtml(value){
      return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    async function apiFetch(path, options = {}){
      const res = await fetch(API_BASE + path, {
        ...options,
        headers: {
          ...authHeaders(),
          ...(options.headers || {})
        }
      });

      let data = {};
      try {
        data = await res.json();
      } catch {}

      if (!res.ok || data.ok === false) {
        throw new Error(data.error || data.detail || "Request failed");
      }

      return data;
    }

    async function searchUsers(){
      const input = document.getElementById("friendSearch");
      const status = document.getElementById("searchStatus");
      const results = document.getElementById("searchResults");
      const q = input.value.trim();

      results.innerHTML = "";
      status.textContent = "";

      if (!q) {
        status.textContent = "Enter your friend’s email address.";
        return;
      }

      try {
        status.textContent = "Searching...";

        const data = await apiFetch("/api/friends/search?q=" + encodeURIComponent(q));
        const users = data.users || [];

        if (!users.length) {
          status.textContent = "No matching user found.";
          return;
        }

        status.textContent = "";

        results.innerHTML = users.map(user => `
          <div class="friend">
            <div>
              <strong>${escapeHtml(user.name || user.email)}</strong>
              <span>${escapeHtml(user.email)}</span>
            </div>
            <div class="actions">
              <button onclick="sendFriendRequest(${Number(user.id)})">Add Friend</button>
            </div>
          </div>
        `).join("");
      } catch (err) {
        status.textContent = "Search failed: " + err.message;
      }
    }

    async function sendFriendRequest(addresseeUserId){
      const status = document.getElementById("searchStatus");

      try {
        status.textContent = "Sending friend request...";

        await apiFetch("/api/friends/request", {
          method: "POST",
          body: JSON.stringify({ addresseeUserId })
        });

        status.textContent = "Friend request sent.";
        document.getElementById("searchResults").innerHTML = "";
        document.getElementById("friendSearch").value = "";
      } catch (err) {
        status.textContent = "Could not send request: " + err.message;
      }
    }

    async function loadRequests(){
      const el = document.getElementById("requestsList");

      try {
        const data = await apiFetch("/api/friends/requests");
        const requests = data.requests || [];

        if (!requests.length) {
          el.innerHTML = `<div class="empty">No pending friend requests.</div>`;
          return;
        }

        el.innerHTML = requests.map(req => `
          <div class="friend">
            <div>
              <strong>${escapeHtml(req.name || req.email)}</strong>
              <span>${escapeHtml(req.email)} wants to add you.</span>
            </div>
            <div class="actions">
              <button onclick="acceptRequest(${Number(req.id)})">Accept</button>
            </div>
          </div>
        `).join("");
      } catch (err) {
        el.innerHTML = `<div class="empty">Could not load requests: ${escapeHtml(err.message)}</div>`;
      }
    }

    async function acceptRequest(requestId){
      try {
        await apiFetch("/api/friends/accept", {
          method: "POST",
          body: JSON.stringify({ requestId })
        });

        await loadRequests();
        await loadFriends();
      } catch (err) {
        alert("Could not accept request: " + err.message);
      }
    }

    async function loadFriends(){
      const el = document.getElementById("friendsList");

      try {
        const data = await apiFetch("/api/friends/list");
        const friends = data.friends || [];

        if (!friends.length) {
          el.innerHTML = `<div class="empty">No friends yet. Search for a golfer above to get started.</div>`;
          return;
        }

        el.innerHTML = friends.map(friend => `
          <div class="friend">
            <div>
              <strong>${escapeHtml(friend.name || friend.email)}</strong>
              <span>${escapeHtml(friend.email)}</span>
            </div>
            <div class="actions">
            <button class="ghost" onclick="window.location.href='/friend-profile.html?userId=${Number(friend.friend_user_id)}'">
              View Rounds & Stats
            </button>
            <button class="ghost" disabled>Share Round soon</button>
            </div>
          </div>
        `).join("");
      } catch (err) {
        el.innerHTML = `<div class="empty">Could not load friends: ${escapeHtml(err.message)}</div>`;
      }
    }

    document.getElementById("searchBtn").addEventListener("click", searchUsers);
    document.getElementById("friendSearch").addEventListener("keydown", (e) => {
      if (e.key === "Enter") searchUsers();
    });

    async function init(){
      if (!getToken()) {
        document.getElementById("searchStatus").textContent =
          "Please log in before adding friends.";
        document.getElementById("requestsList").innerHTML =
          `<div class="empty">Login required.</div>`;
        document.getElementById("friendsList").innerHTML =
          `<div class="empty">Login required.</div>`;
        return;
      }

      await loadRequests();
      await loadFriends();
    }

    init();
  </script>
</body>
</html>
