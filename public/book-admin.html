<!-- public/book-admin.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TeeRadar Booking — Admin</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:0;background:#f4f7fb;color:#0f172a}
    .wrap{max-width:900px;margin:24px auto;padding:0 16px}
    .card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px;margin-bottom:12px}
    input,button,textarea{font:inherit}
    input,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:10px}
    button{padding:10px 12px;border:0;border-radius:10px;background:#00796b;color:#fff;cursor:pointer}
    button.secondary{background:#475569}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .muted{color:#64748b;font-size:13px}
    .list{margin:0;padding-left:18px}
    code{background:#f1f5f9;padding:2px 6px;border-radius:8px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h2>Booking Admin</h2>
      <p class="muted">Login with your <code>BOOKING_ADMIN_SECRET</code> (Render env var). Then create courses + course admins.</p>

      <div class="row">
        <div>
          <label class="muted">Admin Secret</label>
          <input id="secret" type="password" placeholder="Paste BOOKING_ADMIN_SECRET" />
        </div>
        <div style="display:flex;align-items:end;gap:8px">
          <button id="loginBtn">Login</button>
          <button id="logoutBtn" class="secondary">Logout</button>
        </div>
      </div>

      <div id="loginMsg" class="muted" style="margin-top:10px;"></div>
    </div>

    <div class="card">
      <h3>Create / Update Course</h3>
      <div class="row">
        <div>
          <label class="muted">Slug (URL)</label>
          <input id="cSlug" placeholder="hillview  or  marri-park" />
        </div>
        <div>
          <label class="muted">Name</label>
          <input id="cName" placeholder="Hillview Golf Course" />
        </div>
      </div>
      <div style="margin-top:10px">
        <label class="muted">Notes (optional)</label>
        <textarea id="cNotes" rows="2" placeholder="Phone-only course (pilot)"></textarea>
      </div>
      <div style="margin-top:10px">
        <button id="createCourseBtn">Save Course</button>
      </div>
      <div id="courseMsg" class="muted" style="margin-top:10px;"></div>
    </div>

    <div class="card">
      <h3>Create Course Admin User</h3>
      <p class="muted">This creates a login for that course only (we store PBKDF2 hash in DB).</p>
      <div class="row">
        <div>
          <label class="muted">Course Slug</label>
          <input id="aSlug" placeholder="hillview" />
        </div>
        <div>
          <label class="muted">Admin Email</label>
          <input id="aEmail" placeholder="admin@hillview.com.au" />
        </div>
      </div>
      <div style="margin-top:10px">
        <label class="muted">Password</label>
        <input id="aPass" type="password" placeholder="Set a password (8+ chars)" />
      </div>
      <div style="margin-top:10px">
        <button id="createAdminBtn">Save Course Admin</button>
      </div>
      <div id="adminMsg" class="muted" style="margin-top:10px;"></div>
    </div>

    <div class="card">
      <h3>Courses</h3>
      <button id="refreshBtn" class="secondary">Refresh list</button>
      <ul id="courses" class="list"></ul>
    </div>
  </div>

<script>
  async function j(url, opts) {
    const res = await fetch(url, { headers:{ "Content-Type":"application/json" }, ...opts });
    const data = await res.json().catch(()=> ({}));
    if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
    return data;
  }

  const $ = (id) => document.getElementById(id);

  $("loginBtn").onclick = async () => {
    $("loginMsg").textContent = "Logging in...";
    try {
      await j("/api/book/admin/login", { method:"POST", body: JSON.stringify({ secret: $("secret").value }) });
      $("loginMsg").textContent = "✅ Logged in";
      await refresh();
    } catch (e) {
      $("loginMsg").textContent = "❌ " + e.message;
    }
  };

  $("logoutBtn").onclick = async () => {
    try {
      await j("/api/book/admin/logout", { method:"POST", body:"{}" });
      $("loginMsg").textContent = "Logged out";
    } catch (e) {
      $("loginMsg").textContent = "❌ " + e.message;
    }
  };

  $("createCourseBtn").onclick = async () => {
    $("courseMsg").textContent = "Saving...";
    try {
      const out = await j("/api/book/admin/courses", {
        method:"POST",
        body: JSON.stringify({
          slug: $("cSlug").value,
          name: $("cName").value,
          notes: $("cNotes").value
        })
      });
      $("courseMsg").textContent = "✅ Saved: " + out.course.slug + " — opens at /book/" + out.course.slug;
      await refresh();
    } catch (e) {
      $("courseMsg").textContent = "❌ " + e.message;
    }
  };

  $("createAdminBtn").onclick = async () => {
    $("adminMsg").textContent = "Saving...";
    try {
      await j("/api/book/admin/course-admin", {
        method:"POST",
        body: JSON.stringify({
          slug: $("aSlug").value,
          email: $("aEmail").value,
          password: $("aPass").value
        })
      });
      $("adminMsg").textContent = "✅ Course admin saved";
    } catch (e) {
      $("adminMsg").textContent = "❌ " + e.message;
    }
  };

  $("refreshBtn").onclick = refresh;

  async function refresh() {
    const ul = $("courses");
    ul.innerHTML = "";
    try {
      const out = await j("/api/book/admin/courses");
      (out.courses || []).forEach(c => {
        const li = document.createElement("li");
        li.innerHTML = `<b>${c.name}</b> — <code>${c.slug}</code> — <a href="/book/${c.slug}">open</a>`;
        ul.appendChild(li);
      });
    } catch (e) {
      const li = document.createElement("li");
      li.textContent = "❌ " + e.message + " (login first)";
      ul.appendChild(li);
    }
  }

  refresh();
</script>
</body>
</html>
