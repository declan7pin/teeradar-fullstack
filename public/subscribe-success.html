<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TeeRadar – Subscription successful</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --teal: #006b57;
      --teal-dark: #004e40;
      --bg: #f5f7fb;
      --card-bg: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 12px;
    }
    .container {
      max-width: 500px;
      width: 100%;
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px 18px 22px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
      border: 1px solid #e5e7eb;
      text-align: center;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.5rem;
      color: #111827;
    }
    p {
      margin: 0 0 12px;
      font-size: 0.95rem;
      color: #4b5563;
    }
    .btn {
      display: inline-block;
      margin-top: 12px;
      padding: 9px 16px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      color: #ffffff;
      background: var(--teal);
      text-decoration: none;
    }
    .small-note {
      margin-top: 14px;
      font-size: 0.8rem;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Subscription confirmed ✅</h1>
    <p>Thanks for subscribing to TeeRadar.</p>
    <p>
      Next step: create your TeeRadar login so we can link your alerts to your
      email address.
    </p>

    <!-- single clear CTA -->
    <a id="createAccountBtn" class="btn" href="/index.html">
      Continue to create your TeeRadar account
    </a>

    <p class="small-note">
      Use the same email address here that you just used for your TeeRadar
      subscription in Stripe.
    </p>
  </div>

  <script>
    (function () {
      // Grab any useful info from the Stripe redirect
      const params = new URLSearchParams(window.location.search);
      const sessionId = params.get("session_id") || null;

      // Mark that this browser has just completed a Stripe checkout
      try {
        localStorage.setItem("teeradar_paid", "1");
        if (sessionId) {
          localStorage.setItem("teeradar_stripe_session", sessionId);
        }
      } catch (e) {
        console.warn("Could not write to localStorage", e);
      }

      // Send user straight into signup flow
      const createBtn = document.getElementById("createAccountBtn");
      if (createBtn) {
        createBtn.addEventListener("click", function (e) {
          e.preventDefault();
          window.location.href = "/index.html?signup=1";
        });
      }
    })();
  </script>
</body>
</html>
