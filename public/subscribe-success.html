<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TeeRadar – Subscription successful</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --teal: #006b57;
      --teal-dark: #004e40;
      --bg: #f5f7fb;
      --card-bg: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 12px;
    }
    .container {
      max-width: 500px;
      width: 100%;
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px 18px 22px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
      border: 1px solid #e5e7eb;
      text-align: center;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.5rem;
      color: #111827;
    }
    p {
      margin: 0 0 12px;
      font-size: 0.95rem;
      color: #4b5563;
    }
    .btn {
      display: inline-block;
      margin-top: 10px;
      padding: 9px 16px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      color: #ffffff;
      background: var(--teal);
      text-decoration: none;
    }
    .btn.secondary {
      background: #6b7280;
      margin-top: 8px;
    }
    .small-note {
      margin-top: 14px;
      font-size: 0.8rem;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Subscription confirmed ✅</h1>
    <p>Thanks for subscribing to TeeRadar.</p>
    <p>
      Next step: create your TeeRadar login so we can link your alerts to your
      email address.
    </p>

    <a class="btn" href="/index.html">Create your TeeRadar account</a>

    <button class="btn secondary" onclick="window.location.href='/index.html'">
      Back to TeeRadar home
    </button>

    <p class="small-note">
      Use the same email address here that you just used for your TeeRadar
      subscription in Stripe.
    </p>
  </div>
</body>
</html>
