<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>TeeRadar — Group Vote</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root{
      --bg:#f4f7fb;
      --card:#fff;
      --text:#0f172a;
      --muted:#64748b;
      --border:#e2e8f0;
      --green:#00796b;
      --green-dark:#005e55;
      --pill:#ecfeff;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      background:var(--bg);
      color:var(--text);
    }
    .wrap{
      max-width:920px;
      margin:24px auto;
      padding:0 16px 40px;
    }
    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:16px;
      padding:18px;
      margin-bottom:14px;
    }
    h1,h2,h3,p{margin:0}
    .meta{
      margin-top:8px;
      color:var(--muted);
      font-size:14px;
    }
    .options{
      display:grid;
      gap:12px;
      margin-top:14px;
    }
    .option{
      border:1px solid var(--border);
      border-radius:14px;
      padding:14px;
      background:#fff;
    }
    .row{
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:center;
      flex-wrap:wrap;
    }
    .course{
      font-size:18px;
      font-weight:700;
    }
    .sub{
      color:var(--muted);
      margin-top:4px;
      font-size:14px;
    }
    .pill{
      display:inline-flex;
      align-items:center;
      padding:6px 10px;
      border-radius:999px;
      background:var(--pill);
      color:var(--green-dark);
      font-size:13px;
      font-weight:700;
    }
    button, .btn{
      appearance:none;
      border:none;
      border-radius:12px;
      padding:10px 14px;
      cursor:pointer;
      font:inherit;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
    }
    .primary{ background:var(--green); color:#fff; }
    .secondary{ background:#e2e8f0; color:#0f172a; }
    .ghost{ background:#fff; border:1px solid var(--border); color:#0f172a; }
    .toolbar{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:14px;
    }
    .winner{
      border-color:#10b981;
      box-shadow:0 0 0 1px #10b981 inset;
    }
    .hidden{ display:none !important; }
    .msg{
      margin-top:12px;
      color:var(--green-dark);
      font-weight:600;
    }
    .error{
      color:#b91c1c;
      margin-top:10px;
      font-weight:600;
    }
    .authBox{
      margin-top:16px;
      padding:14px;
      border:1px dashed var(--border);
      border-radius:14px;
      background:#fafafa;
    }
    input{
      width:100%;
      margin-top:8px;
      padding:12px;
      border:1px solid var(--border);
      border-radius:12px;
      font:inherit;
      background:#fff;
    }
    .small{
      font-size:13px;
      color:var(--muted);
      margin-top:8px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1 id="title">Loading group vote...</h1>
      <div id="meta" class="meta"></div>
      <p id="note" class="meta" style="margin-top:10px;"></p>
      <div class="toolbar">
        <button id="copyBtn" class="ghost">Copy link</button>
        <button id="refreshBtn" class="secondary">Refresh</button>
      </div>
      <div id="message" class="msg"></div>
      <div id="error" class="error"></div>
    </div>

    <div id="authBox" class="card authBox hidden">
      <h3>Vote to lock in the round</h3>
      <p class="small">Create a free TeeRadar account to cast your vote.</p>
      <input id="email" type="email" placeholder="Email" />
      <input id="password" type="password" placeholder="Password" />
      <div class="toolbar">
        <button id="signupVoteBtn" class="primary">Create account & vote</button>
        <button id="loginVoteBtn" class="ghost">Log in & vote</button>
      </div>
      <div id="authError" class="error"></div>
    </div>

    <div id="options" class="options"></div>
  </div>

  <script>
    const qs = new URLSearchParams(location.search);
    const publicId = qs.get("id");

    const els = {
      title: document.getElementById("title"),
      meta: document.getElementById("meta"),
      note: document.getElementById("note"),
      options: document.getElementById("options"),
      message: document.getElementById("message"),
      error: document.getElementById("error"),
      authBox: document.getElementById("authBox"),
      email: document.getElementById("email"),
      password: document.getElementById("password"),
      authError: document.getElementById("authError"),
      signupVoteBtn: document.getElementById("signupVoteBtn"),
      loginVoteBtn: document.getElementById("loginVoteBtn"),
      copyBtn: document.getElementById("copyBtn"),
      refreshBtn: document.getElementById("refreshBtn"),
    };

    let state = {
      vote: null,
      pendingOptionId: null,
    };

    function fmtDate(dateStr) {
      try {
        return new Date(dateStr + "T00:00:00").toLocaleDateString();
      } catch {
        return dateStr;
      }
    }

    function fmtExpiry(ts) {
      if (!ts) return "No expiry";
      const d = new Date(ts);
      if (Number.isNaN(d.getTime())) return "";
      return "Closes " + d.toLocaleString();
    }

        function getAuthToken() {
      try {
        return (
          localStorage.getItem("tr_token") ||
          localStorage.getItem("token") ||
          ""
        );
      } catch {
        return "";
      }
    }

    async function api(url, opts = {}) {
      const token = getAuthToken();

      const mergedHeaders = {
        "Content-Type": "application/json",
        ...(opts.headers || {}),
      };

      if (token) {
        mergedHeaders.Authorization = `Bearer ${token}`;
      }

      const r = await fetch(url, {
        credentials: "include",
        ...opts,
        headers: mergedHeaders,
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data?.error || "request_failed");
      return data;
    }

    function render() {
      const vote = state.vote;
      if (!vote) return;

      els.title.textContent = vote.title || "Group Vote";
      els.meta.textContent = `${vote.creatorName || "Someone"} created this vote • ${fmtExpiry(vote.expiresAt)}`;
      els.note.textContent = vote.note || "";

      els.options.innerHTML = "";

      for (const opt of vote.options) {
        const isWinner = Number(vote.selectedOptionId || 0) === Number(opt.id);
        const isMine = Number(vote.myOptionId || 0) === Number(opt.id);

        const card = document.createElement("div");
        card.className = "option" + (isWinner ? " winner" : "");

                const displayName =
          opt.display_name ||
          opt.option_label ||
          opt.course_label ||
          opt.course_name;

        card.innerHTML = `
          <div class="row">
            <div>
              <div class="course">${displayName}</div>
              <div class="sub">
                ${fmtDate(opt.play_date)} • ${opt.tee_time} • ${opt.holes} holes • ${opt.players} players
              </div>
            </div>
            <div class="pill">${opt.vote_count || 0} vote${Number(opt.vote_count || 0) === 1 ? "" : "s"}</div>
          </div>
          <div class="toolbar">
            ${vote.canVote ? `<button class="primary voteBtn" data-option-id="${opt.id}">${isMine ? "Change vote to this" : "Vote for this"}</button>` : ``}
            ${opt.booking_url ? `<a class="ghost btn" href="${opt.booking_url}">View booking</a>` : ``}
            ${vote.canChooseWinner ? `<button class="secondary selectBtn" data-option-id="${opt.id}">Choose winner</button>` : ``}
            ${isWinner ? `<span class="pill">Selected tee time</span>` : ``}
            ${isMine ? `<span class="pill">Your vote</span>` : ``}
          </div>
        `;

        els.options.appendChild(card);
      }

      document.querySelectorAll(".voteBtn").forEach((btn) => {
        btn.addEventListener("click", () => handleVoteClick(Number(btn.dataset.optionId)));
      });

      document.querySelectorAll(".selectBtn").forEach((btn) => {
        btn.addEventListener("click", () => chooseWinner(Number(btn.dataset.optionId)));
      });
    }

    async function loadVote() {
      els.error.textContent = "";
      try {
        const data = await api(`/api/group-votes/${encodeURIComponent(publicId)}`);
        state.vote = data.vote;
        render();
      } catch (err) {
        els.error.textContent = err.message || "Failed to load vote";
      }
    }

    async function handleVoteClick(optionId) {
      els.message.textContent = "";
      els.error.textContent = "";

      try {
        const data = await api(`/api/group-votes/${encodeURIComponent(publicId)}/vote`, {
          method: "POST",
          body: JSON.stringify({ optionId }),
        });
        state.vote = data.vote;
        els.authBox.classList.add("hidden");
        els.message.textContent = "Your vote has been counted.";
        render();
      } catch (err) {
        if (String(err.message || "").includes("unauthorized")) {
          state.pendingOptionId = optionId;
          els.authBox.classList.remove("hidden");
          els.authError.textContent = "";
          return;
        }
        els.error.textContent = err.message || "Could not save vote";
      }
    }

    async function chooseWinner(optionId) {
      els.message.textContent = "";
      els.error.textContent = "";
      try {
        const data = await api(`/api/group-votes/${encodeURIComponent(publicId)}/select`, {
          method: "POST",
          body: JSON.stringify({ optionId }),
        });
        state.vote = data.vote;
        els.message.textContent = "Winning tee time selected.";
        render();
      } catch (err) {
        els.error.textContent = err.message || "Could not select winner";
      }
    }

    // Replace these endpoints if your auth endpoints differ
        async function signupAndVote() {
      els.authError.textContent = "";
      try {
        const data = await api("/api/auth/signup", {
          method: "POST",
          body: JSON.stringify({
            email: els.email.value.trim(),
            password: els.password.value.trim(),
          }),
        });

        if (data?.token) {
          localStorage.setItem("tr_token", data.token);
        }
        if (data?.user) {
          localStorage.setItem("tr_user", JSON.stringify(data.user));
        }

        if (!state.pendingOptionId) return;
        await handleVoteClick(state.pendingOptionId);
      } catch (err) {
        els.authError.textContent = err.message || "Signup failed";
      }
    }

        async function loginAndVote() {
      els.authError.textContent = "";
      try {
        const data = await api("/api/auth/login", {
          method: "POST",
          body: JSON.stringify({
            email: els.email.value.trim(),
            password: els.password.value.trim(),
          }),
        });

        if (data?.token) {
          localStorage.setItem("tr_token", data.token);
        }
        if (data?.user) {
          localStorage.setItem("tr_user", JSON.stringify(data.user));
        }

        if (!state.pendingOptionId) return;
        await handleVoteClick(state.pendingOptionId);
      } catch (err) {
        els.authError.textContent = err.message || "Login failed";
      }
    }

    els.signupVoteBtn.addEventListener("click", signupAndVote);
    els.loginVoteBtn.addEventListener("click", loginAndVote);
    els.refreshBtn.addEventListener("click", loadVote);
    els.copyBtn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(location.href);
        els.message.textContent = "Link copied.";
      } catch {
        els.error.textContent = "Could not copy link.";
      }
    });

    if (!publicId) {
      els.error.textContent = "Missing group vote id.";
    } else {
      loadVote();
    }
  </script>
</body>
</html>
